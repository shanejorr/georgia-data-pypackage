[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "georgiacivicdata"
version = "0.1.0"
description = "Access public data from Georgia Civic Data: education, Census, immigration and health data about Georgia as pandas or Polars data frames."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shane Orr", email = "shane@georgiacivicdata.org" }]
requires-python = ">=3.10"
keywords = ["georgia", "open data", "education", "census", "school zones", "api client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.1",
  "platformdirs>=4.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
geo = ["geopandas>=1.0", "shapely>=2.0"]
all = ["georgiacivicdata[polars,geo]"]

[project.urls]
Homepage = "https://georgiacivicdata.org/py/"
Documentation = "https://georgiacivicdata.org/py/"
Source = "https://github.com/shanejorr/georgia-data-pypackage"
Issues = "https://github.com/shanejorr/georgia-data-pypackage/issues"
"API documentation" = "https://georgiacivicdata.org/docs"

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "syrupy>=4",
]
lint = [
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "ruff>=0.6",
]
docs = [
  "sphinx>=7.3",
  "pydata-sphinx-theme>=0.15",
  "myst-nb>=1.1",
  "sphinx-copybutton>=0.5",
  "sphinx-markdown-builder>=0.6",
  "jupytext>=1.16",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["src/georgiacivicdata", "tests", "README.md", "LICENSE", "NEWS.md"]
exclude = ["tests/**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/georgiacivicdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["live: calls the production API (run only with GCD_LIVE_TESTS=true)"]
filterwarnings = ["error::DeprecationWarning:georgiacivicdata"]

[tool.coverage.run]
source = ["georgiacivicdata"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Executed notebooks are generated from docs/notebooks/*.md by docs/precompile.py.
extend-exclude = ["docs/index.ipynb", "docs/articles/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "N"]
ignore = ["RET504", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PT011", "E501"]
"src/georgiacivicdata/_places.py" = ["RUF001"]
"docs/**" = ["E402", "B018", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/georgiacivicdata"]
strict = true
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["pyarrow.*", "geopandas.*", "shapely.*", "respx.*"]
ignore_missing_imports = true
