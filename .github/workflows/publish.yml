# Publish the package with trusted publishing (OpenID Connect): PyPI and
# TestPyPI trust this workflow, so no API token is stored anywhere.
#
# - TestPyPI: run this workflow by hand (`gh workflow run publish.yml`, or
#   Actions > Publish > Run workflow). It builds, uploads to TestPyPI, then
#   downloads the wheel back from TestPyPI, installs it and imports it.
# - PyPI: publish a GitHub release tagged v<version> (v0.1.0). The tag must
#   match the version in pyproject.toml. The release also redeploys the docs
#   (docs.yml).
#
# A version can be uploaded only once to each index.
#
# One-time setup, on pypi.org and on test.pypi.org: add a (pending) trusted
# publisher with owner shanejorr, repository georgia-data-pypackage, workflow
# publish.yml and environment pypi (on PyPI) or testpypi (on TestPyPI).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One publish at a time; never cancel one half-way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Read the version
        id: version
        run: |
          version=$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The release tag is $TAG but pyproject.toml has version $VERSION (expected tag v$VERSION)."
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and import it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import os, georgiacivicdata as gcd; assert gcd.__version__ == os.environ['VERSION'], gcd.__version__"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/georgiacivicdata/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-install:
    # The wheel comes from TestPyPI; its dependencies come from PyPI.
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install the package from TestPyPI and import it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # TestPyPI's index can take a minute or two to list a new upload.
          for attempt in $(seq 1 10); do
            if uvx pip download --no-deps --no-cache-dir --only-binary :all: \
                --index-url https://test.pypi.org/simple/ --dest from-testpypi \
                "georgiacivicdata==$VERSION"; then
              break
            fi
            echo "Not on TestPyPI's index yet (attempt $attempt); retrying in 30 seconds."
            sleep 30
          done
          ls from-testpypi/*.whl
          uv venv /tmp/testpypi-env
          uv pip install --python /tmp/testpypi-env from-testpypi/*.whl
          /tmp/testpypi-env/bin/python -c "import os, georgiacivicdata as gcd; assert gcd.__version__ == os.environ['VERSION'], gcd.__version__; print(gcd.__version__, len(gcd.__all__))"

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/georgiacivicdata/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
